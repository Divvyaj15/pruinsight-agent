# PruInsight — one-command local deploy
# Learn: Compose reads this file and builds/runs the service for you.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8501
#   docker compose down

services:
  pruinsight:
    build:
      context: .
      dockerfile: Dockerfile
    image: pruinsight-agent:latest
    container_name: pruinsight
    ports:
      # host:container  →  browser uses host port 8501
      - "8501:8501"
    env_file:
      # Loads GROQ_API_KEY, TAVILY_API_KEY, LANGSMITH_*, optional SERPER/FRED
      # (file stays on your machine; not baked into the image)
      - .env
    environment:
      # Optional overrides / defaults
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
